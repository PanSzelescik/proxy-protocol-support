# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Publish to CurseForge and Modrinth

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.2.0
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
      - name: Build with Gradle
        run: ./gradlew build
      - name: Publish Fabric to CurseForge and Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: mfONdVnp
          modrinth-featured: true
          modrinth-unfeature-mode: intersection
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 623925
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}

          files: |
            build/libs/!(*-@(dev|dev-shadow|sources|javadoc)).jar
            build/libs/*-@(dev|dev-shadow|sources|javadoc).jar

          name: ""
          version-type: release

          loaders: |
            fabric
          modrinth-game-versions: |
            >=26.1
          curseforge-game-versions: |
            >=26.1
          java: |
            >=25

          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail
